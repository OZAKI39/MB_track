<script>
const data=JSON.parse(document.getElementById('review-data').textContent);
const byId=id=>document.getElementById(id);
const frameSelect=byId('frame'), viewSelect=byId('view');
const cache=new Map(); let variantIndex=1, requestNumber=0;
data.frames.forEach((frame,i)=>frameSelect.add(new Option(`Frame ${frame.frame_index} | ${frame.relative_time_s.toFixed(3)} s`,i)));
data.views.forEach((view,i)=>viewSelect.add(new Option(view.title,i)));
data.variants.forEach((variant,i)=>{
 const button=document.createElement('button'); button.textContent=variant.label;
 button.addEventListener('click',()=>{variantIndex=i;render()});byId('radii').append(button);
});
data.sheets.forEach(path=>{const link=document.createElement('a');link.href=path;link.textContent=path.replaceAll('_',' ').replace('.png','');byId('sheets').append(link)});
if(data.sections){
 byId('sections').hidden=false;
 byId('sections-image').src='wall_sections.png';
 const table=document.createElement('table');table.style.borderSpacing='18px 6px';
 const header=table.insertRow();['Candidate',...Object.keys(data.sections)].forEach(name=>{const cell=document.createElement('th');cell.textContent=name;cell.title=data.sections[name]||name;header.append(cell)});
 data.variants.filter(v=>v.section_distances_px).forEach(v=>{const row=table.insertRow();[v.label,...Object.keys(data.sections).map(k=>v.section_distances_px[k]+' px')].forEach(value=>{row.insertCell().textContent=value})});
 byId('section-table').append(table);
}
function picture(path){
 if(!cache.has(path)) cache.set(path,new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(new Error(`Cannot load ${path}`));image.src=path}));
 return cache.get(path);
}
async function render(){
 const request=++requestNumber; byId('error').textContent='';
 const frame=data.frames[Number(frameSelect.value)], variant=data.variants[variantIndex], view=data.views[Number(viewSelect.value)];
 document.querySelectorAll('#radii button').forEach((button,i)=>{button.classList.toggle('active',i===variantIndex);button.setAttribute('aria-pressed',String(i===variantIndex))});
 byId('previous').disabled=Number(frameSelect.value)===0;byId('next').disabled=Number(frameSelect.value)===data.frames.length-1;
 byId('after-title').textContent=`Candidate · ${variant.label}`;
 byId('section-values').textContent=variant.section_distances_px?Object.entries(variant.section_distances_px).map(([key,value])=>`${key}: ${value} px`).join(' | '):'';
 byId('metrics').textContent=`Mask area removed: ${variant.removed_mask_percent.toFixed(2)}% | Frame ${frame.frame_index}`;
 byId('download').href=variant.mask;
 try{
  await document.fonts.load('16px ReviewArial');
  if(!document.fonts.check('16px ReviewArial'))throw new Error('Arial could not be loaded.');
  const original=await picture(frame.image);
  const panels=await Promise.all([0,variantIndex].map(async index=>{
   const v=data.variants[index], layers=[];
   if(byId('removed').checked)layers.push(await picture(v.removed));
   if(byId('mask').checked)layers.push(await picture(v.boundary));
   if(byId('detection').checked)layers.push(await picture(frame.overlays[index]));
   return layers;
  }));
  if(request!==requestNumber)return;
  ['before','after'].forEach((id,i)=>{
   const canvas=byId(id),[x,y,w,h]=view.xywh;canvas.width=w;canvas.height=h;
   const context=canvas.getContext('2d');context.imageSmoothingEnabled=false;
   for(const image of [original,...panels[i]])context.drawImage(image,x,y,w,h,0,0,w,h);
  });
  document.body.dataset.rendered=`${frame.frame_index}:${variant.id}:${view.id}`;
 }catch(error){if(request===requestNumber)byId('error').textContent=error.message}
}
frameSelect.addEventListener('change',render);viewSelect.addEventListener('change',render);
['detection','mask','removed'].forEach(id=>byId(id).addEventListener('change',render));
byId('previous').addEventListener('click',()=>{frameSelect.selectedIndex=Math.max(0,frameSelect.selectedIndex-1);render()});
byId('next').addEventListener('click',()=>{frameSelect.selectedIndex=Math.min(data.frames.length-1,frameSelect.selectedIndex+1);render()});
document.addEventListener('keydown',event=>{if(event.target.matches('select,input,button'))return;if(event.key==='ArrowRight')byId('next').click();if(event.key==='ArrowLeft')byId('previous').click()});
variantIndex=Math.min(1,data.variants.length-1);render();
</script>
